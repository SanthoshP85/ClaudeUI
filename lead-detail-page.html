<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lead Detail</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; font-size: 14px; min-height: 100vh; }

  .topbar { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 12px; }
  .back-btn { border: none; background: none; cursor: pointer; color: #555; font-size: 18px; padding: 6px; border-radius: 6px; display: flex; align-items: center; transition: background .15s; }
  .back-btn:hover { background: #f0f0f0; }
  .back-btn:disabled { opacity: .3; cursor: default; }
  .back-btn:disabled:hover { background: none; }
  .topbar-spacer { flex: 1; }
  .icon-btn { border: 1px solid #e0e0e0; background: #fff; cursor: pointer; padding: 6px 10px; border-radius: 7px; font-size: 13px; color: #444; display: flex; align-items: center; gap: 5px; transition: background .15s; }
  .icon-btn:hover { background: #f5f5f5; }
  .edit-btn { border: 1px solid #e0e0e0; background: #fff; cursor: pointer; padding: 6px 14px; border-radius: 7px; font-size: 13px; color: #333; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: background .15s; }
  .edit-btn:hover { background: #f5f5f5; }

  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 0; max-width: 1200px; margin: 0 auto; min-height: calc(100vh - 52px); }

  .left { background: #fff; border-right: 1px solid #e8e8e8; padding: 24px; }
  .lead-name { font-size: 22px; font-weight: 600; color: #111; margin-bottom: 10px; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; border: 1px solid transparent; font-weight: 400; }
  .badge-amber { background: #FEF3C7; color: #92400E; border-color: #FDE68A; }
  .badge-gray  { background: #F3F4F6; color: #374151; border-color: #E5E7EB; }
  .badge-blue  { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }

  .info-grid { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 16px 20px; padding: 16px 0; border-top: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0; margin-bottom: 24px; align-items: start; }
  .info-field label { font-size: 11px; color: #888; display: block; margin-bottom: 3px; }
  .info-field span  { font-size: 13px; color: #222; font-weight: 500; }
  .info-btn { border: 1px solid #e0e0e0; background: #fff; cursor: pointer; padding: 6px 12px; border-radius: 7px; font-size: 12px; color: #555; display: flex; align-items: center; gap: 5px; white-space: nowrap; align-self: center; transition: background .15s; }
  .info-btn:hover { background: #f5f5f5; }

  .section-title { font-size: 14px; font-weight: 600; color: #111; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .empty-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 0; color: #bbb; gap: 8px; }
  .empty-box p { font-size: 13px; color: #aaa; }
  .timeline-dot { width: 10px; height: 10px; border-radius: 50%; background: #4F46E5; flex-shrink: 0; margin-top: 4px; }

  .right { background: #fff; padding: 0; overflow-y: auto; }
  .sidebar-block { padding: 18px; border-bottom: 1px solid #f0f0f0; }
  .sidebar-block:last-child { border-bottom: none; }
  .sb-title { font-size: 15px; font-weight: 600; color: #111; margin-bottom: 12px; }

  .qa-btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 9px 12px; border: 1px solid #e8e8e8; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; color: #333; margin-bottom: 7px; transition: background .15s; }
  .qa-btn:hover { background: #f9f9f9; }
  .qa-btn:last-child { margin-bottom: 0; }
  .qa-btn.disabled { color: #ccc; cursor: default; }
  .qa-btn.disabled:hover { background: #fff; }

  .li-row { display: flex; margin-bottom: 10px; gap: 8px; }
  .li-row:last-child { margin-bottom: 0; }
  .li-key { font-size: 13px; font-weight: 500; color: #333; min-width: 110px; }
  .li-val { font-size: 13px; color: #555; }
  .pill { font-size: 11px; padding: 2px 9px; border-radius: 12px; font-weight: 500; display: inline-block; }
  .pill-amber { background: #FEF3C7; color: #92400E; }
  .pill-gray  { background: #F3F4F6; color: #555; }

  /* Linked Leads */
  .ll-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .ll-title { font-size: 15px; font-weight: 600; color: #111; }
  .ll-add-btn { display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 4px 10px; border: 1px solid #e0e0e0; border-radius: 7px; background: none; cursor: pointer; color: #555; transition: all .15s; }
  .ll-add-btn:hover { background: #f5f5f5; color: #111; }

  .ll-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 8px; border: 1px solid #f0f0f0; background: #fafafa; margin-bottom: 7px; transition: border-color .15s; }
  .ll-item:hover { border-color: #e0e0e0; }
  .av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .av-purple { background: #EDE9FE; color: #5B21B6; }
  .av-teal   { background: #CCFBF1; color: #0F766E; }
  .av-blue   { background: #DBEAFE; color: #1D4ED8; }
  .ll-info { flex: 1; min-width: 0; }
  .ll-name { font-size: 13px; font-weight: 500; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ll-name a { color: #1D4ED8; text-decoration: none; font-weight: 500; cursor: pointer; }
  .ll-name a:hover { text-decoration: underline; color: #1e40af; }
  .ll-phone { font-size: 11px; color: #888; margin-top: 1px; }
  .ll-unlink { border: none; background: none; cursor: pointer; color: #ccc; padding: 4px; border-radius: 5px; font-size: 14px; display: flex; align-items: center; transition: all .12s; }
  .ll-unlink:hover { background: #FEE2E2; color: #B91C1C; }

  #ll-search-wrap { border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; margin-top: 2px; display: none; }
  #ll-search-wrap.active { display: block; }
  .ll-search-row { display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
  .ll-search-row input { border: none; outline: none; flex: 1; font-size: 13px; color: #111; background: transparent; }
  .ll-search-row input::placeholder { color: #bbb; }
  .si { font-size: 15px; color: #aaa; }
  .xbtn { border: none; background: none; cursor: pointer; color: #aaa; font-size: 13px; padding: 2px 4px; border-radius: 4px; display: flex; align-items: center; }
  .xbtn:hover { background: #f0f0f0; color: #555; }
  #ll-results { padding: 4px; }
  .r-item { display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: 7px; cursor: pointer; transition: background .1s; }
  .r-item:hover { background: #f5f5f5; }
  .r-item.selected { background: #EDE9FE; }
  .r-name { font-size: 13px; font-weight: 500; color: #111; }
  .r-ph   { font-size: 11px; color: #888; margin-top: 1px; }
  .r-checkbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #ccc; background: #fff; display: flex; align-items: center; justify-content: center; margin-left: auto; flex-shrink: 0; transition: all .12s; font-size: 11px; color: transparent; }
  .r-item.selected .r-checkbox { background: #5B21B6; border-color: #5B21B6; color: #fff; }
  .r-item:hover .r-checkbox { border-color: #9780e0; }
  .ll-divhr { height: 1px; background: #f0f0f0; margin: 3px 8px; }
  .new-row { display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: 7px; cursor: pointer; transition: background .1s; }
  .new-row:hover { background: #f5f5f5; }
  .new-av { width: 30px; height: 30px; border-radius: 50%; border: 1.5px dashed #ccc; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 14px; flex-shrink: 0; }
  .new-label { font-size: 13px; color: #555; }
  .new-label b { color: #111; font-weight: 500; }
  .no-result-msg { text-align: center; padding: 12px 8px 6px; font-size: 12px; color: #aaa; }
  .no-result-msg b { color: #555; }
  .ll-footer { padding: 9px 12px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; gap: 7px; align-items: center; }
  .btn-cancel { padding: 6px 12px; border: 1px solid #e0e0e0; background: none; border-radius: 7px; font-size: 12px; cursor: pointer; color: #555; transition: background .12s; }
  .btn-cancel:hover { background: #f5f5f5; }
  .btn-link { padding: 6px 14px; border: none; background: #111; color: #fff; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer; opacity: .35; transition: opacity .12s; }
  .btn-link.ready { opacity: 1; }
  .sel-count { font-size: 11px; color: #7C3AED; font-weight: 500; padding: 0 4px; display: none; margin-right: auto; }
  .sel-count.visible { display: inline; }

  #ll-form-wrap { border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; margin-top: 2px; display: none; }
  #ll-form-wrap.active { display: block; }
  .form-head { padding: 9px 12px; background: #fafafa; border-bottom: 1px solid #f0f0f0; font-size: 12px; font-weight: 500; color: #666; display: flex; align-items: center; gap: 5px; }
  .form-body { padding: 12px; }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  .ffield { display: flex; flex-direction: column; gap: 4px; }
  .ffield label { font-size: 11px; color: #888; }
  .ffield input { border: 1px solid #e0e0e0; border-radius: 7px; padding: 7px 9px; font-size: 13px; color: #111; outline: none; transition: border-color .12s, box-shadow .12s; background: #fff; }
  .ffield input:focus { border-color: #7C3AED; box-shadow: 0 0 0 3px #EDE9FE; }
  .form-footer { display: flex; justify-content: flex-end; gap: 7px; margin-top: 12px; }
  .btn-create { padding: 6px 14px; border: none; background: #5B21B6; color: #fff; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer; transition: background .12s; }
  .btn-create:hover { background: #4C1D95; }

  /* Page transition */
  .layout { animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" id="back-btn" onclick="goBack()" disabled>&#8592;</button>
  <div class="topbar-spacer"></div>
  <button class="icon-btn">&#8635;</button>
  <button class="edit-btn">&#9998; Edit</button>
</div>

<div id="app"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const allLeads = {
  'arun-kumar': {
    id: 'arun-kumar',
    name: 'Arun Kumar',
    initials: 'AK',
    color: 'av-blue',
    priority: 'medium',
    sentiment: 'neutral',

  },
  'priya-kapoor': {

    color: 'av-purple',
    priority: 'high',
    sentiment: 'positive',
    source: 'Meta Leads: Campaign-Name: (Delhi OPD | 10 May) Ad-Name (All Ads)',
    phone: '919810044201',
    phoneNumber: '9810044201',
    question: 'क्या आपको पेट से जुड़ी कोई समस्या है?',
    answer: 'हाँ?',
    city: 'Delhi',
    created: '18 May, 2026 | 9:12 AM',
    linkedLeads: ['arun-kumar'],
  },
  'rahul-sharma': {
    id: 'rahul-sharma',
    name: 'Rahul Sharma',
    initials: 'RS',
    color: 'av-teal',
    priority: 'low',
    sentiment: 'neutral',
    source: 'Google Ads: Campaign Gastro May',
    phone: '918123456780',
    phoneNumber: '8123456780',
    question: 'क्या आपको पेट से जुड़ी कोई समस्या है?',
    answer: 'नहीं',
    city: 'Mumbai',
    created: '15 May, 2026 | 3:45 PM',
    linkedLeads: [],
  },
  'amit-verma': {
    id: 'amit-verma',
    name: 'Amit Verma',
    initials: 'AV',
    color: 'av-blue',
    priority: 'medium',
    sentiment: 'neutral',
    source: 'Facebook Ads: Campaign Health May',
    phone: '919810577123',
    phoneNumber: '9810577123',
    question: 'क्या आपको पेट से जुड़ी कोई समस्या है?',
    answer: 'हाँ?',
    city: 'Bangalore',
    created: '17 May, 2026 | 11:30 AM',
    linkedLeads: [],
  },
  'sunita-kapoor': {
    id: 'sunita-kapoor',
    name: 'Sunita Kapoor',
    initials: 'SK',
    color: 'av-purple',
    priority: 'high',
    sentiment: 'positive',
    source: 'Instagram Ads: May Campaign',
    phone: '919900112233',
    phoneNumber: '9900112233',
    question: 'क्या आपको पेट से जुड़ी कोई समस्या है?',
    answer: 'हाँ?',
    city: 'Chennai',
    created: '16 May, 2026 | 2:20 PM',
    linkedLeads: [],
  },
  'meena-kumari': {
    id: 'meena-kumari',
    name: 'Meena Kumari',
    initials: 'MK',
    color: 'av-teal',
    priority: 'low',
    sentiment: 'neutral',
    source: 'Walk-in',
    phone: '917001188990',
    phoneNumber: '7001188990',
    question: 'क्या आपको पेट से जुड़ी कोई समस्या है?',
    answer: 'हाँ?',
    city: 'Hyderabad',
    created: '14 May, 2026 | 8:00 AM',
    linkedLeads: [],
  },
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let history = ['arun-kumar'];
let currentId = 'arun-kumar';
let selectedLeads = new Set();

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function navigateTo(id) {
  if (!allLeads[id]) return;
  history.push(id);
  currentId = id;
  renderPage();
}

function goBack() {
  if (history.length <= 1) return;
  history.pop();
  currentId = history[history.length - 1];
  renderPage();
}

function renderPage() {
  const lead = allLeads[currentId];
  document.getElementById('app').innerHTML = buildPage(lead);
  document.getElementById('back-btn').disabled = history.length <= 1;
  document.title = `Lead Detail — ${lead.name}`;
  selectedLeads = new Set();
}

// ── BUILD PAGE ────────────────────────────────────────────────────────────────
function buildPage(lead) {
  const priorityClass = lead.priority === 'high' ? 'badge-amber' : lead.priority === 'medium' ? 'badge-amber' : 'badge-gray';
  const sentimentClass = 'badge-gray';

  const linkedHTML = lead.linkedLeads.map(lid => {
    const l = allLeads[lid];
    if (!l) return '';
    return `
      <div class="ll-item">
        <div class="av ${l.color}">${l.initials}</div>
        <div class="ll-info">
          <div class="ll-name"><a href="javascript:void(0)" onclick="navigateTo('${l.id}')">${l.name}</a></div>
          <div class="ll-phone">+91 ${l.phoneNumber}</div>
        </div>
        <button class="ll-unlink" title="Unlink" onclick="unlinkLead(this, '${lead.id}', '${l.id}')">&#8856;</button>
      </div>`;
  }).join('');

  return `
  <div class="layout">
    <div class="left">
      <div class="lead-name">${lead.name}</div>
      <div class="badge-row">
        <span class="badge ${priorityClass}">Priority: ${lead.priority}</span>
        <span class="badge ${sentimentClass}">Sentiment: ${lead.sentiment}</span>
        <span class="badge badge-blue">Source: ${lead.source}</span>
      </div>
      <div class="info-grid">
        <div class="info-field"><label>Phone</label><span>${lead.phone}</span></div>
        <div class="info-field"><label>${lead.question}</label><span>${lead.answer}</span></div>
        <div class="info-field"><label>Full Name</label><span>${lead.name}</span></div>
        <button class="info-btn">&#8595; Info</button>
        <div class="info-field"><label>Phone Number</label><span>${lead.phoneNumber}</span></div>
        <div class="info-field" style="grid-column:2"><label>City</label><span>${lead.city}</span></div>
      </div>

      <div class="section-title">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Appointments
      </div>
      <div class="empty-box">
        <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="#ccc" stroke-width="1.5"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="1" x2="8" y2="5"/><line x1="16" y1="1" x2="16" y2="5"/><line x1="2" y1="9" x2="22" y2="9"/></svg>
        <p>No appointments</p>
      </div>

      <div class="section-title" style="margin-top:24px">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Activity Timeline
      </div>
      <div style="display:flex;gap:10px;margin-bottom:10px">
        <div class="timeline-dot"></div>
        <div>
          <div style="font-size:12px;color:#888">${lead.created}</div>
          <div style="font-size:13px;color:#333;margin-top:2px">Lead created from ${lead.source}</div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="sidebar-block">
        <div class="sb-title">Quick Actions</div>
        <button class="qa-btn">&#128222; Call Patient</button>
        <button class="qa-btn">&#128172; Conversation</button>
        <button class="qa-btn">&#128197; Schedule Appointment</button>
        <button class="qa-btn">&#127891; Create Ticket</button>
        <button class="qa-btn">&#9745; Create Task</button>
        <button class="qa-btn disabled">&#128100; View Patient Profile</button>
      </div>

      <div class="sidebar-block">
        <div class="sb-title">Lead Information</div>
        <div class="li-row"><span class="li-key">Lead Manager:</span><span class="li-val">Unassigned</span></div>
        <div class="li-row"><span class="li-key">Disposition:</span><span class="li-val"><span class="pill pill-amber">Not Set</span></span></div>
        <div class="li-row"><span class="li-key">Sentiment:</span><span class="li-val"><span class="pill pill-gray">${lead.sentiment}</span></span></div>
        <div class="li-row"><span class="li-key">Lead Source:</span><span class="li-val" style="font-size:12px;line-height:1.4">${lead.source}</span></div>
        <div class="li-row"><span class="li-key">Created:</span><span class="li-val">${lead.created}</span></div>
      </div>

      <div class="sidebar-block" id="ll-section">
        <div class="ll-head">
          <span class="ll-title">Linked Leads</span>
          <button class="ll-add-btn" id="ll-open-btn" onclick="openSearch()">+ Link lead</button>
        </div>
        <div id="ll-list">${linkedHTML}</div>

        <div id="ll-search-wrap">
          <div class="ll-search-row">
            <span class="si">&#128269;</span>
            <input type="text" id="ll-search-input" placeholder="Search by phone number…" oninput="handleSearch(this.value)" />
            <button class="xbtn" onclick="closeSearch()">&#10005;</button>
          </div>
          <div id="ll-results"></div>
          <div class="ll-footer">
            <span class="sel-count" id="sel-count-label"></span>
            <button class="btn-cancel" onclick="closeSearch()">Cancel</button>
            <button class="btn-link" id="ll-link-btn" onclick="doLink()">Link selected</button>
          </div>
        </div>

        <div id="ll-form-wrap">
          <div class="form-head">&#128100; New lead</div>
          <div class="form-body">
            <div class="frow">
              <div class="ffield"><label>Full name</label><input type="text" id="form-name" placeholder="e.g. Sunita Rao" /></div>
              <div class="ffield"><label>Phone number</label><input type="text" id="form-phone" placeholder="10-digit number" /></div>
            </div>
            <div class="form-footer">
              <button class="btn-cancel" onclick="closeForm()">Cancel</button>
              <button class="btn-create" onclick="createAndLink()">Create &amp; link</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
const searchableLeads = () => Object.values(allLeads).filter(l => l.id !== currentId && !allLeads[currentId].linkedLeads.includes(l.id));

function openSearch() {
  document.getElementById('ll-search-wrap').classList.add('active');
  document.getElementById('ll-open-btn').style.display = 'none';
  document.getElementById('ll-search-input').focus();
  renderResults('');
}

function closeSearch() {
  document.getElementById('ll-search-wrap').classList.remove('active');
  document.getElementById('ll-open-btn').style.display = '';
  document.getElementById('ll-search-input').value = '';
  selectedLeads.clear();
  updateLinkBtn();
}

function closeForm() {
  document.getElementById('ll-form-wrap').classList.remove('active');
  document.getElementById('ll-open-btn').style.display = '';
  document.getElementById('form-name').value = '';
  document.getElementById('form-phone').value = '';
}

function handleSearch(val) {
  selectedLeads.clear();
  updateLinkBtn();
  renderResults(val.trim());
}

function renderResults(query) {
  const container = document.getElementById('ll-results');
  const pool = searchableLeads();
  const matches = query.length > 0
    ? pool.filter(l => l.phoneNumber.includes(query) || ('+91'+l.phoneNumber).includes(query))
    : pool;

  let html = '';
  if (matches.length > 0) {
    matches.forEach(l => {
      const isSel = selectedLeads.has(l.id);
      html += `
        <div class="r-item${isSel ? ' selected' : ''}" onclick="toggleLead(this, '${l.id}')">
          <div class="av ${l.color}" style="width:30px;height:30px;font-size:10px">${l.initials}</div>
          <div class="ll-info">
            <div class="r-name">${l.name}</div>
            <div class="r-ph">+91 ${l.phoneNumber}</div>
          </div>
          <div class="r-checkbox">${isSel ? '✓' : ''}</div>
        </div>`;
    });
    if (query.length > 0) {
      html += `<div class="ll-divhr"></div>
        <div class="new-row" onclick="openForm('${query}')">
          <div class="new-av">+</div>
          <div class="new-label">Create new lead <b>${query}</b></div>
        </div>`;
    }
  } else {
    html = `<div class="no-result-msg">No lead found for <b>${query}</b></div>
      <div class="ll-divhr"></div>
      <div class="new-row" onclick="openForm('${query}')">
        <div class="new-av">+</div>
        <div class="new-label">Create new lead <b>${query}</b></div>
      </div>`;
  }
  container.innerHTML = html;
}

function toggleLead(el, id) {
  if (selectedLeads.has(id)) {
    selectedLeads.delete(id);
    el.classList.remove('selected');
    el.querySelector('.r-checkbox').textContent = '';
  } else {
    selectedLeads.add(id);
    el.classList.add('selected');
    el.querySelector('.r-checkbox').textContent = '✓';
  }
  updateLinkBtn();
}

function updateLinkBtn() {
  const btn = document.getElementById('ll-link-btn');
  const countEl = document.getElementById('sel-count-label');
  const n = selectedLeads.size;
  if (n > 0) {
    btn.classList.add('ready');
    btn.textContent = n === 1 ? 'Link 1 lead' : `Link ${n} leads`;
    countEl.textContent = `${n} selected`;
    countEl.classList.add('visible');
  } else {
    btn.classList.remove('ready');
    btn.textContent = 'Link selected';
    countEl.classList.remove('visible');
  }
}

function doLink() {
  if (!selectedLeads.size) return;
  selectedLeads.forEach(id => {
    if (!allLeads[currentId].linkedLeads.includes(id)) {
      allLeads[currentId].linkedLeads.push(id);
      if (!allLeads[id].linkedLeads.includes(currentId)) {
        allLeads[id].linkedLeads.push(currentId);
      }
    }
  });
  renderPage();
}

function openForm(phone) {
  document.getElementById('ll-search-wrap').classList.remove('active');
  document.getElementById('ll-form-wrap').classList.add('active');
  document.getElementById('form-phone').value = phone;
  document.getElementById('form-name').focus();
}

function createAndLink() {
  const name  = document.getElementById('form-name').value.trim();
  const phone = document.getElementById('form-phone').value.trim();
  if (!name) { document.getElementById('form-name').focus(); return; }
  const id = name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();
  const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  const colors = ['av-purple', 'av-teal', 'av-blue'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  allLeads[id] = {
    id, name, initials, color,
    priority: 'medium', sentiment: 'neutral',
    source: 'Manually created',
    phone: '91' + phone, phoneNumber: phone,
    question: 'क्या आपको पेट से जुड़ी कोई समस्या है?',
    answer: '—', city: '—',
    created: new Date().toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }),
    linkedLeads: [currentId],
  };
  allLeads[currentId].linkedLeads.push(id);
  renderPage();
}

function unlinkLead(btn, fromId, targetId) {
  if (!confirm('Unlink this lead?')) return;
  allLeads[fromId].linkedLeads = allLeads[fromId].linkedLeads.filter(id => id !== targetId);
  allLeads[targetId].linkedLeads = allLeads[targetId].linkedLeads.filter(id => id !== fromId);
  renderPage();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderPage();
</script>
</body>
</html>
